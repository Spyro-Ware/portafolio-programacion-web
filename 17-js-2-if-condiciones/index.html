<!DOCTYPE html>
<html>
<head>
  <title>if - Condiciones</title>
  <meta charset="UTF-8">
  <script>
    edad = prompt("Cuantos años tienes?");
    edad = Number(edad);

    if (edad >= 18) {
      console.log("Mayor de edad, pasele adulto");
    } else if (edad >= 13) {
      console.log("Adolescente, saquese morrillo miado");
    } else {
      console.log("Niño");
    }
  </script>
</head>
<body>

</body>
</html>
